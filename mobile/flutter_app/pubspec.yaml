name: cutawan_mobile
description: Native Flutter companion app for Cutawan AI video clipping.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  crypto: ^3.0.6
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0
  whisper_cpp_flutter_plus: 0.5.1
  llama_flutter_android: ^0.2.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/testdata/clip-preview-grid.png
    - assets/testdata/clip-preview-grid.mp4
    - assets/testdata/clip-preview-grid-portrait.png
    - assets/testdata/clip-preview-grid-portrait.mp4
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Poppins Medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
