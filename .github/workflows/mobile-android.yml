name: Mobile Android (Flutter)

on:
  push:
    branches: [main]
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
    inputs:
      validation_batch:
        description: "Validation batch"
        required: false
        default: "main"
        type: string
      capture_page_goldens:
        description: "Capture/update Flutter page golden baselines"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    name: Analyze, test, and build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Android generation script syntax
        run: bash -n tooling/generate_android_platform.sh tooling/generate_media3_transition_fixture.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Install FFmpeg for deterministic Media3 test fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate and validate deterministic Media3 fixture
        run: bash tooling/generate_media3_transition_fixture.sh
      - name: Install pinned Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"
      - name: Generate Android platform files
        run: bash tooling/generate_android_platform.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib test integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage --reporter expanded
      - name: Upload Flutter coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutawan-mobile-flutter-coverage
          path: mobile/flutter_app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
      - name: Build ARM64 debug APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=BUILD_SHA=${{ github.sha }}
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Media3 transitions and Flutter preview/export pixels on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: mobile/flutter_app/android
          script: |
            ./gradlew --no-daemon --stacktrace app:connectedDebugAndroidTest
            cd .. && timeout 12m flutter test integration_test/clip_preview_export_parity_test.dart -d emulator-5554 --reporter expanded
      - name: Verify APK contains ARM64 libraries only and no duplicated native libraries
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              entries = archive.namelist()
              abis = {
                  PurePosixPath(name).parts[1]
                  for name in entries
                  if name.startswith("lib/") and len(PurePosixPath(name).parts) > 2
              }
              if abis != {"arm64-v8a"}:
                  raise SystemExit(f"Expected ARM64-only APK, found native ABIs: {sorted(abis)}")
              native_files = [
                  name for name in entries
                  if name.startswith("lib/arm64-v8a/") and name.endswith(".so")
              ]
              basenames = [PurePosixPath(name).name for name in native_files]
              duplicates = sorted({
                  name for name in basenames
                  if basenames.count(name) > 1
              })
              if duplicates:
                  raise SystemExit(f"Duplicate native libraries in APK: {duplicates}")
              required = {
                  "libwhisper_flutter.so",
                  "libllama_jni.so",
                  "libllama.so",
                  "libggml-base.so",
              }
              missing = sorted(required - set(basenames))
              if missing:
                  raise SystemExit(f"Missing required native inference libraries: {missing}")
              whisper_ggml = sorted(
                  name for name in basenames
                  if name.startswith("libggml") and name != "libggml-base.so"
              )
              print(
                  f"Verified ARM64-only APK: {len(native_files)} unique native libraries; "
                  f"GGML libraries={whisper_ggml + ['libggml-base.so']}"
              )
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cutawan-mobile-arm64-debug
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
