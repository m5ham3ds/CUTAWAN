name: Branch policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-test-branch:
    name: Sync CUTAWAN-TEST and dispatch validation
    runs-on: ubuntu-latest
    steps:
      - name: Sync test ref to the exact main commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = 'CUTAWAN-TEST';

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/' + branch,
              sha: context.sha,
              force: true,
            });

            core.notice('Synchronized ' + branch + ' to ' + context.sha);

      - name: Dispatch all automated validation on CUTAWAN-TEST
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let capturePageGoldens = false;
            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path: 'mobile/flutter_app/test/goldens/pages/dashboard-compact-rtl-light.png',
                ref: 'main',
              });
            } catch (error) {
              if (error.status === 404) {
                capturePageGoldens = true;
              } else {
                throw error;
              }
            }

            await Promise.all([
              github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'mobile-android.yml',
                ref: 'CUTAWAN-TEST',
                inputs: {
                  validation_batch: 'main-' + context.sha.slice(0, 7),
                  capture_page_goldens: capturePageGoldens,
                },
              }),
              github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: 'CUTAWAN-TEST',
              }),
            ]);
            core.notice('Dispatched Mobile Android and desktop CI on CUTAWAN-TEST');

  prune-legacy-branches:
    name: Retire every branch except main and CUTAWAN-TEST
    needs: sync-test-branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy refs after history was preserved
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const allowed = new Set(['main', 'CUTAWAN-TEST']);
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const protectedRefs = [];
            const errors = [];

            for (const branch of branches) {
              if (allowed.has(branch.name)) continue;
              if (branch.protected) {
                protectedRefs.push(branch.name);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: 'heads/' + branch.name,
                });
                deleted.push(branch.name);
              } catch (error) {
                errors.push(branch.name + ': ' + error.message);
              }
            }

            core.notice('Deleted ' + deleted.length + ' legacy branches: ' + deleted.join(', '));
            if (protectedRefs.length) {
              core.warning('Protected refs were not deleted: ' + protectedRefs.join(', '));
            }
            if (errors.length) {
              core.setFailed('Some legacy branches could not be deleted: ' + errors.join('; '));
            }
