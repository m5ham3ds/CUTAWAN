name: Branch policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enforce-single-main-branch:
    name: Verify main is the only branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert that no secondary branches exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const names = branches.map((branch) => branch.name).sort();
            if (names.length !== 1 || names[0] !== 'main') {
              core.setFailed(
                'Expected exactly one branch named main; found: ' + names.join(', '),
              );
              return;
            }
            core.notice('Branch policy passed: main is the only branch.');
