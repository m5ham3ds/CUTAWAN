name: Branch policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-main:
    name: Dispatch validation on main
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android and desktop validation on main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await Promise.all([
              github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'mobile-android.yml',
                ref: 'main',
                inputs: {
                  validation_batch: 'main-' + context.sha.slice(0, 7),
                  capture_page_goldens: false,
                },
              }),
              github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                ref: 'main',
              }),
            ]);
            core.notice('Dispatched Mobile Android and desktop CI on main: ' + context.sha);
